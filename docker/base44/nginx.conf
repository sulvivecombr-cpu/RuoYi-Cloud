# Sandbox web entry point (host port 3000).
# Same shape as docker/nginx/conf/nginx.conf: serve the UI from / and proxy /prod-api/
# to the gateway. Here the UI directory is the container's own html root, which is
# bind-mounted from docker/base44/html (placeholder until the ruoyi-ui build is dropped in).
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            index  index.html index.htm;
        }

        location /prod-api/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://ruoyi-gateway:8080/;
        }
    }
}
