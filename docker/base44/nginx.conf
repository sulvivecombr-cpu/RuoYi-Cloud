# Sandbox web entry point (host port 3000) — a single origin for the admin UI and the API.
#
#   /           -> ruoyi-ui      (Vite dev server, live reload)
#   /prod-api/  -> ruoyi-gateway (the base path the UI is pointed at)
#   /dev-api/   -> ruoyi-gateway (the UI's own .env default, accepted as well)
#
# Same shape as docker/nginx/conf/nginx.conf, which proxies /prod-api/ the same way.
#
# Upstreams are resolved per request (variable + Docker's embedded DNS) instead of once at
# startup: `docker compose up -d <service>` gives a recreated container a new IP, and a
# statically resolved name would then send every request to the dead address — the entry point
# answers 502 until nginx itself is restarted. `valid=10s` caps how long an address is cached.
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    resolver 127.0.0.11 valid=10s ipv6=off;  # Docker embedded DNS

    # Only upgrade the connection when the client actually asked for a websocket (Vite HMR).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       80;
        server_name  localhost;

        # Admin UI. Host is forwarded unchanged so Vite's allowed-host check and its HMR
        # websocket work behind the preview proxy.
        location / {
            set $ui_upstream http://ruoyi-ui:80;
            proxy_pass $ui_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /prod-api/ {
            set $api_upstream http://ruoyi-gateway:8080;
            rewrite ^/prod-api/(.*)$ /$1 break;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass $api_upstream;
        }

        location /dev-api/ {
            set $api_upstream http://ruoyi-gateway:8080;
            rewrite ^/dev-api/(.*)$ /$1 break;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass $api_upstream;
        }
    }
}
